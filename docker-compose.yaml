services:
  postgres:
    image: postgres:17
    container_name: recruitment-management-platform-authentication
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentication-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: